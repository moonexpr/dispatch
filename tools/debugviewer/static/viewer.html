<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dispatch · workflow debug viewer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cirrus-ui@0.8.0/dist/cirrus.min.css">
<script src="vendor/elk.bundled.js"></script>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --panel2: #1c232c; --line: #2b333d;
    --ink: #e6edf3; --muted: #8b949e; --accent: #58a6ff; --accent2: #d2a8ff;
    --ok: #3fb950; --warn: #d29922; --err: #f85149;
    --edge: #566; --edge-loop: #d29922;
    --insp-w: 300px;   /* inspector width — the drag handle rewrites this */
    --side-w: 232px;   /* left sidebar width — its drag handle rewrites this */
    --input-bg: #0d1117;   /* form fields, code + event panes */
    --dot: #1b2129;        /* canvas dot-grid */
    --code-ink: #a5d6ff;   /* JSON output text */
    --node-ink: #e6edf3;   /* graph node label — flips with the theme (light block overrides) */
    --node-sub: #8b949e;   /* graph node sub-label */
    /* graph node palette — one var per state kind / action namespace; the
       [data-theme="light"] block below carries the light variants. */
    --node-action: #30363d; --node-loop: #3a2f0b; --node-par: #2a2140;
    --node-start: #123020; --node-end: #3a1517; --node-ctrl: #0d2a30; --node-supersede: #241a33;
    --ns-github: #1f6feb; --ns-architect: #8957e5; --ns-budget: #238636;
    --ns-admin: #9e6a03; --ns-engineer: #0969da; --ns-loop: #bb8009;
    --stroke-action: #3d444d; --stroke-loop: #d29922; --stroke-par: #d2a8ff;
    --stroke-start: #3fb950; --stroke-end: #f85149; --stroke-ctrl: #39c5cf;
    color-scheme: dark;    /* theme native controls (number spinners, checkbox, select, scrollbars) */
  }
  /* light theme: chrome AND graph go light — node fills switch to tinted variants
     and node ink flips dark, so labels stay readable in both modes. */
  :root[data-theme="light"] {
    --bg: #f6f8fa; --panel: #ffffff; --panel2: #eef1f4; --line: #d0d7de;
    --ink: #1f2328; --muted: #656d76; --accent: #0969da; --accent2: #8250df;
    --ok: #1a7f37; --warn: #9a6700; --err: #cf222e;
    --edge: #8c959f; --edge-loop: #9a6700;
    --input-bg: #ffffff; --dot: #e3e8ee; --code-ink: #0550ae;
    --node-ink: #1f2328; --node-sub: #57606a;
    --node-action: #eaeef2; --node-loop: #fff8c5; --node-par: #fbefff;
    --node-start: #dafbe1; --node-end: #ffebe9; --node-ctrl: #cff4f8; --node-supersede: #f3eaff;
    --ns-github: #80ccff; --ns-architect: #d8b9ff; --ns-budget: #aceebb;
    --ns-admin: #fae17d; --ns-engineer: #b6e3ff; --ns-loop: #ffd8b5;
    --stroke-action: #afb8c1; --stroke-loop: #9a6700; --stroke-par: #8250df;
    --stroke-start: #1a7f37; --stroke-end: #cf222e; --stroke-ctrl: #1b7c83;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display: grid; grid-template-columns: var(--side-w) 1fr var(--insp-w); grid-template-rows: 46px 1fr;
    grid-template-areas: "head head head" "side canvas insp";
    height: 100vh; overflow: hidden; padding: 0;
  }
  header {
    grid-area: head; display: flex; align-items: center; gap: 14px;
    padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  header h1 .dot { color: var(--accent); }
  header .spacer { flex: 1; }
  header label { color: var(--muted); font-size: 12px; }
  select, button {
    background: var(--panel2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 9px; font: inherit; cursor: pointer;
    /* undo Cirrus's global button/select reset that overflows the header */
    text-transform: none; letter-spacing: normal; min-width: 0; margin: 0;
    line-height: 1.45; vertical-align: middle;
  }
  select { width: auto; }
  button:hover, select:hover { border-color: var(--accent); }
  button.on { border-color: var(--accent); color: var(--accent); }

  aside.side { grid-area: side; position: relative; background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; }
  /* left-sidebar drag handle: sits on the sidebar's right edge; mirrors .insp-resize */
  .side-resize { position: absolute; right: -3px; top: 0; bottom: 0; width: 7px; cursor: col-resize; z-index: 6; }
  .side-resize::after { content: ""; position: absolute; left: 3px; top: 0; bottom: 0; width: 1px; background: transparent; transition: background .15s; }
  .side-resize:hover::after, body.resizing .side-resize::after { background: var(--accent); }
  .side .cap { padding: 10px 14px 6px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .8px; }
  .wf { padding: 9px 14px; border-left: 3px solid transparent; cursor: pointer; }
  .wf:hover { background: var(--panel2); }
  .wf.sel { background: var(--panel2); border-left-color: var(--accent); }
  .wf .n { font-weight: 600; }
  .wf .m { color: var(--muted); font-size: 11px; }
  .wf .bad { color: var(--err); font-size: 11px; }

  main.canvas { grid-area: canvas; position: relative; overflow: auto;
    display: flex; align-items: safe center; justify-content: safe center; background:
    radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 0) 0 0 / 22px 22px, var(--bg); }
  svg { display: block; max-width: none; height: auto; }
  .phaseband { fill-opacity: .06; }
  .phaselabel { fill: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; font-weight: 700; }
  .node rect { stroke-width: 1.5; rx: 8; cursor: pointer; fill: var(--node-action); stroke: var(--stroke-action); }
  /* fills/strokes resolve from the theme palette vars via kind + namespace classes,
     so a theme toggle rethemes the graph with no redraw */
  .node.loop rect { fill: var(--node-loop); stroke: var(--stroke-loop); }
  .node.fork rect, .node.join rect { fill: var(--node-par); stroke: var(--stroke-par); }
  .node.start rect { fill: var(--node-start); stroke: var(--stroke-start); }
  .node.end rect { fill: var(--node-end); stroke: var(--stroke-end); }
  .node.controller rect { fill: var(--node-ctrl); stroke: var(--stroke-ctrl); stroke-width: 2; }
  .node.supersede rect { fill: var(--node-supersede); stroke: var(--accent2); }
  .node.ns-github rect { fill: var(--ns-github); }
  .node.ns-architect rect { fill: var(--ns-architect); }
  .node.ns-budget rect { fill: var(--ns-budget); }
  .node.ns-admin rect { fill: var(--ns-admin); }
  .node.ns-engineer rect { fill: var(--ns-engineer); }
  .node.ns-loop rect { fill: var(--ns-loop); }
  .node text { fill: var(--node-ink); font-size: 11.5px; pointer-events: none; }
  .node .sub { fill: var(--node-sub); font-size: 9.5px; }
  .node.sel rect { stroke: var(--accent); stroke-width: 2.5; }
  .node.active rect { stroke: var(--accent); stroke-width: 3; filter: drop-shadow(0 0 6px var(--accent)); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { filter: drop-shadow(0 0 3px var(--accent));} 50% { filter: drop-shadow(0 0 9px var(--accent));} }
  .node.done-ok rect { stroke: var(--ok); }
  .node.done-err rect { stroke: var(--err); stroke-width: 2.5; }
  .node.active .sub, .node.done-ok .sub { fill: var(--node-ink); }
  .edge { fill: none; stroke: var(--edge); stroke-width: 1.5; }
  .edge.loop-back { stroke: var(--edge-loop); stroke-dasharray: 5 4; }
  .edge.fork, .edge.join { stroke: var(--accent2); }
  .edge.supersede { stroke: var(--accent2); stroke-dasharray: 6 4; }
  .edgelabel { fill: var(--edge-loop); font-size: 9.5px; }
  .node.supersede text { fill: var(--accent2); }

  aside.insp { grid-area: insp; position: relative; background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; display: flex; flex-direction: column; }
  /* drag handle: sits on the inspector's left edge; drag to resize, double-click to reset */
  .insp-resize { position: absolute; left: -3px; top: 0; bottom: 0; width: 7px; cursor: col-resize; z-index: 6; }
  .insp-resize::after { content: ""; position: absolute; left: 3px; top: 0; bottom: 0; width: 1px; background: transparent; transition: background .15s; }
  .insp-resize:hover::after, body.resizing .insp-resize::after { background: var(--accent); }
  body.resizing { cursor: col-resize; user-select: none; }
  .insp .cap { padding: 10px 14px 6px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .8px; }
  .insp .body { padding: 4px 14px 14px; flex: 1; }
  .insp .placeholder { color: var(--muted); padding: 14px; }
  .insp-title { margin-bottom: 6px; }
  /* collapsible attribute block */
  details.attr-fold { border-bottom: 1px solid var(--line); margin-bottom: 6px; }
  details.attr-fold > summary { list-style: none; cursor: pointer; color: var(--muted); font-size: 11px;
    text-transform: uppercase; letter-spacing: .8px; padding: 2px 0 6px; user-select: none; display: flex; align-items: center; gap: 6px; }
	probe .pf + details.pf-adv summary { text-align: right; }
  details.attr-fold > summary::-webkit-details-marker { display: none; }
  details.attr-fold > summary::before { content: "▸"; font-size: 9px; transition: transform .12s; }
  details.attr-fold[open] > summary::before { transform: rotate(90deg); }
  details.attr-fold > summary:hover { color: var(--accent); }
  .attr-body { padding-bottom: 2px; }
  .kv { margin: 8px 0; }
  .kv .k { color: var(--muted); font-size: 11px; }
  .kv .v { word-break: break-word; }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 10.5px; border: 1px solid var(--line); margin: 2px 3px 0 0; }
  ul.io { margin: 4px 0 0; padding-left: 16px; }
  ul.io li { color: var(--ink); }

  /* probe panel */
  .probe { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
  .probe .cap { padding: 0 0 2px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .8px; }
  .probe .hint { color: var(--muted); font-size: 11px; line-height: 1.45; margin: 0 0 8px; }
  .probe .pf { margin: 6px 0; }
  .probe .pf label { display: block; color: var(--muted); font-size: 10.5px; margin-bottom: 2px; }
  .probe textarea { width: 100%; resize: vertical; min-height: 26px; background: var(--input-bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; font: 11px/1.4 ui-monospace, Menlo, monospace; }
  .probe textarea:focus { outline: none; border-color: var(--accent); }
  .probe .pf-none { color: var(--muted); font-size: 11px; margin: 4px 0; }

  /* schema-driven typed fields */
  .pgroup { margin: 8px 0; border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; background: var(--input-bg); }
  .pgroup-h { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .pgroup-ref { color: var(--accent); font-size: 11px; font-weight: 600; }
  .pf-src { font-size: 9px; color: var(--ok); border: 1px solid var(--line); border-radius: 999px; padding: 0 6px; line-height: 15px; }
  .pf-src.raw { color: var(--muted); }
  .pf.pf-inline { display: flex; align-items: center; gap: 8px; }
  .pf.pf-inline label { margin-bottom: 0; }
  .tk { color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: .4px; }
  /* font/padding are !important because Cirrus styles inputs with a five-:not()
     chain (input:not([type=checkbox]):not([type=radio])…, specificity 0,5,1) that
     otherwise beats .probe input.pfield (0,2,1) — giving inputs a big proportional
     font + fat padding while textareas (no such Cirrus rule) keep ours. */
  .probe input.pfield, .probe textarea.pfield, .probe select.pfield { width: 100%; background: var(--input-bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 4px 7px !important; font: 11px/1.4 ui-monospace, Menlo, monospace !important; letter-spacing: normal !important; }
  .probe textarea.pfield { resize: vertical; min-height: 24px; }
  .probe input.pf-bool { width: auto; }
  .probe input.pfield:focus, .probe textarea.pfield:focus, .probe select.pfield:focus { outline: none; border-color: var(--accent); }
  .req { color: var(--err); font-weight: 700; margin-left: 2px; }
  .pgroup.invalid { border-color: var(--err); }
  .pf-errs { margin-top: 3px; }
  .pf-err { color: var(--err); font-size: 10px; line-height: 1.35; word-break: break-word; }
  .probe .pf-rawjson { width: 100%; resize: vertical; min-height: 26px; background: var(--input-bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; font: 11px/1.4 ui-monospace, Menlo, monospace; }
  .probe .pf-rawjson:focus { outline: none; border-color: var(--accent); }
  .probe details.pf-adv summary { color: var(--muted); font-size: 11px; cursor: pointer; margin: 4px 0; }
  .probe-actions { display: flex; gap: 8px; align-items: stretch; margin-top: 8px; }
  /* both buttons share one height + centered content so they line up exactly */
  .probe-actions button { height: 40px; padding: 0 14px; display: inline-flex; align-items: center;
    justify-content: center; line-height: 1; text-transform: none; }
  button.probe-run { border-color: var(--accent); color: var(--accent); flex: 1; font-size: 14px !important; font-weight: 600; }
  /* single live toggle — off is muted, on turns solid red (real model, tokens, network) */
  button.probe-live { flex: 0 0 auto; color: var(--muted); font-weight: bold }
  button.probe-live.on { color: var(--err) !important; border-color: var(--err);
    background: color-mix(in srgb, var(--err) 14%, var(--input-bg));
    box-shadow: 0 0 7px var(--err); animation: liveglow 1.6s ease-in-out infinite; }
  @keyframes liveglow { 0%,100% { box-shadow: 0 0 4px var(--err); } 50% { box-shadow: 0 0 12px var(--err); } }
  .probe-out { margin-top: 10px; }
  .probe-out .pres { font-weight: 600; font-size: 12px; margin-bottom: 4px; }
  .probe-out .pres.ok { color: var(--ok); } .probe-out .pres.err { color: var(--err); }
  .probe-out .plabel { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .6px; margin: 8px 0 2px; }
  .probe-out pre.pj { margin: 0; background: var(--input-bg); border: 1px solid var(--line); border-radius: 6px;
    padding: 7px 8px; font: 10.5px/1.45 ui-monospace, Menlo, monospace; color: var(--code-ink); overflow-x: auto; max-height: 240px; white-space: pre; }
  .probe-out .perr { color: var(--err); font-size: 11.5px; word-break: break-word; }
  .probe-out .muted { color: var(--muted); font-size: 11px; }
  /* shelf-change diff blocks: highlighted per shelf (deliverables = green, shared = purple) */
  .probe-out .shelf-change { border-left: 3px solid var(--line); border-radius: 0 6px 6px 0; padding: 6px 8px; margin: 6px 0; background: var(--input-bg); }
  .probe-out .shelf-change.deliverables { border-left-color: var(--ok); background: color-mix(in srgb, var(--ok) 8%, var(--input-bg)); }
  .probe-out .shelf-change.shared { border-left-color: var(--accent2); background: color-mix(in srgb, var(--accent2) 9%, var(--input-bg)); }
  .probe-out .sc-head { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
  .probe-out .sc-ref { font-weight: 600; font-size: 11px; word-break: break-all; }
  .probe-out .sc-tag { margin-left: auto; font-size: 9px; text-transform: uppercase; letter-spacing: .4px; border: 1px solid var(--line); border-radius: 999px; padding: 0 6px; color: var(--muted); }
  .probe-out .sc-tag.new { color: var(--ok); border-color: var(--ok); }
  .probe-out .sc-tag.changed { color: var(--warn); border-color: var(--warn); }
  .probe-out .shelf-change pre.pj { margin: 0; }

  /* compact panel pinned to the foot of the inspector column (the #insp body above
     is flex:1 and pushes it down). flex:0 0 auto = size to content, not 46% of panel. */
  /* live-sessions panel: top of the left sidebar, above the workflow list */
  .sessions { border-bottom: 1px solid var(--line); padding: 12px 14px; background: var(--panel2); display: flex; flex-direction: column; }
  .sessions .cap { padding: 0 0 6px; }
  /* collapsible: summary keeps the .cap look, disclosure arrow floats right */
  .sessions > summary { list-style: none; cursor: pointer; user-select: none; display: flex; align-items: center; }
  .sessions > summary::-webkit-details-marker { display: none; }
  .sessions > summary::after { content: "▾"; margin-left: auto; font-size: 10px; transition: transform .12s; }
  .sessions:not([open]) > summary::after { transform: rotate(-90deg); }
  .sessions:not([open]) > summary.cap { padding-bottom: 0; }
  .sessions > summary:hover { color: var(--accent); }
  /* flex:0 0 auto + padding:0 override Cirrus's global `.row{flex:1;padding:.5rem 0}`,
     which otherwise makes this row grow and open big vertical gaps. */
  .sessions .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex: 0 0 auto; padding: 0; }
  .sessions .row .st { margin-left: auto; font-size: 11px; }
  .st.running { color: var(--accent); } .st.succeeded { color: var(--ok); }
  .st.failed, .st.errored { color: var(--err); } .st.idle, .st.stopped { color: var(--muted); }
  /* live runs: out-of-process sidecars the viewer tails (foundation.trace) */
  .sessions .live-cap { padding: 0 0 6px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .sessions .mini { padding: 1px 6px; font-size: 10px; line-height: 1.3; }
  .liveruns { display: flex; flex-direction: column; gap: 6px; }
  .liveruns .small { font-size: 10.5px; }
  .liverun { border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; cursor: pointer; background: var(--input-bg); }
  .liverun:hover { border-color: var(--accent); }
  .lr-main { display: flex; align-items: center; gap: 6px; }
  .lr-id { font-weight: 600; font-size: 11px; word-break: break-all; }
  .lr-main .st { margin-left: auto; font-size: 10px; }
  .lr-sub { color: var(--muted); font-size: 10px; margin-top: 2px; }
  /* live-sessions header: label + rescan/auto controls, run status pinned right */
  .live-cap .st { margin-left: auto; }
  .mini.toggle { color: var(--muted); }
  .mini.toggle.on { color: var(--accent); border-color: var(--accent); }
  /* mock runner tucked into a small collapsed fold below the live sessions */
  .mockfold { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
  .mockfold > summary { list-style: none; cursor: pointer; user-select: none; color: var(--muted);
    font-size: 11px; text-transform: uppercase; letter-spacing: .8px; padding: 2px 0; display: flex; align-items: center; }
  .mockfold > summary::-webkit-details-marker { display: none; }
  .mockfold > summary::after { content: "▾"; margin-left: auto; font-size: 10px; transition: transform .12s; }
  .mockfold:not([open]) > summary::after { transform: rotate(-90deg); }
  .mockfold > summary:hover { color: var(--accent); }
  .mockfold .row { margin-top: 8px; }
  button.run { border-color: var(--ok); color: var(--ok); }
  button:disabled { opacity: .4; cursor: not-allowed; border-color: var(--line); color: var(--muted); }
  .elog { height: 168px; overflow-y: auto; font-size: 10.5px; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: var(--input-bg); }
  .elog .ev { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .elog .en { color: var(--accent); } .elog .lv { color: var(--muted); }
  .elog .lv.err { color: var(--err); } .elog .ok { color: var(--ok); }
  .elog .t { color: #586; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; padding: 8px 14px; color: var(--muted); font-size: 11px; border-top: 1px solid var(--line); }
  .legend .sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; border: 1px solid #0006; }
</style>
</head>
<body>
<header>
  <h1><span class="dot">◆</span> dispatch <span style="color:var(--muted)">/ workflow debug viewer</span></h1>
  <div class="spacer"></div>
  <label for="wfsel">workflow</label>
  <select id="wfsel"></select>
  <button id="refresh" title="Recompile graph from YAML">↻ refresh</button>
  <button id="auto" title="Auto-refresh every 3s">● live</button>
  <button id="theme" title="Toggle light / dark mode">◐ theme</button>
</header>

<aside class="side">
  <div class="side-resize" id="sideResize" title="Drag to resize · double-click to reset"></div>
  <section class="sessions" id="sessions">
    <div class="cap live-cap">live sessions
      <button type="button" class="mini" id="liverefresh" title="Rescan for external live-run sidecars">↻</button>
      <button type="button" class="mini toggle on" id="autoattach" title="Auto-attach the newest live run as it appears">⦿ auto</button>
      <span class="st idle" id="runstatus">idle</span>
    </div>
    <div class="liveruns" id="liveruns"></div>
    <div class="elog" id="elog"><div class="ev lv">Waiting for a live session… start one (e.g. <code>oneshot … --live</code>) and it attaches here automatically. Or use the mock runner below.</div></div>
    <!--<details class="mockfold" id="mockFold">
      <summary class="cap">mock run · in-process, no network</summary>
      <div class="row">
        <button class="run" id="runbtn" title="Run this workflow under the mock engine and watch it live">▶ run &amp; watch</button>
      </div>
		</details>-->
  </section>
  <div class="cap">workflows</div>
  <div id="wflist"></div>
	<button class="run" id="runbtn" title="Run this workflow under the mock engine and watch it live">▶ run &amp; watch</button>
  <div class="legend" id="legend"></div>
</aside>

<main class="canvas" id="canvas">
  <svg id="svg" width="100" height="100"></svg>
</main>

<aside class="insp">
  <div class="insp-resize" id="inspResize" title="Drag to resize · double-click to reset"></div>
  <div class="cap">inspector</div>
  <div class="body" id="insp"><div class="placeholder">Click a state to inspect its action, budget, permissions and I/O.</div></div>
</aside>

<script>
const el = id => document.getElementById(id);
const svgNS = "http://www.w3.org/2000/svg";
let SEL_WF = null, SEL_NODE = null, GRAPH = null, autoTimer = null;
let RUNNABLE = [], NODE_BY_STATE = {}, ES = null, CUR_RUN = null;
let RUN_VIS = {};          // state_id -> "active"|"done-ok"|"done-err": run highlights, survive a redraw
let LAST_GRAPH_SIG = null;  // signature of the last-drawn graph, so an unchanged refresh skips the (flashing) redraw
let AUTO_ATTACH = true;     // auto-attach the newest actively-running external run
let ATTACHED_ID = null;     // sidecar id we've attached (claimed before the async attach, to prevent double-attach)
let ATTR_OPEN = false;  // inspector "attributes" fold state — collapsed by default, preserved across node clicks
let PROBE_LIVE = false;  // probe mock↔live mode — preserved across node clicks; live calls the real model
// The declarative shelf-key contract for the selected workflow (graph.schemas):
// "shelf.key" -> {type, description, fields:[{name,type,required,enum,...}]}.
function schemaFor(ref){ return (GRAPH && GRAPH.schemas && GRAPH.schemas[ref]) || null; }

function mk(tag, attrs, kids) {
  const n = document.createElementNS(svgNS, tag);
  for (const k in (attrs||{})) n.setAttribute(k, attrs[k]);
  for (const c of (kids||[])) n.appendChild(c);
  return n;
}
// Node fills/strokes are CSS-driven: the kind class (.loop, .controller, …) and,
// for actions, an ns-<namespace> class resolve to the theme palette vars in :root,
// giving every color a light-theme variant with no redraw on toggle.

const NODE_H = 40;
const nodeW = n => Math.min(190, 66 + n.label.length * 6.4);

// -- ELK layered layout (elkjs). Async: elk.layout returns a Promise. Loop-back edges
// are excluded from the layout pass (they'd fight the DAG ranking) and drawn as
// manual bulges afterward. Returns node centers + ELK's routed edge sections. --
async function elkLayout(graph) {
  const elk = new ELK();
  const fwd = graph.edges.filter(e => e.kind !== "loop-back");
  const byId = {}; graph.nodes.forEach(n => byId[n.id] = n);
  const children = graph.nodes.map(n => ({ id: n.id, width: nodeW(n), height: NODE_H }));
  const edges = fwd.map((e, i) => ({ id: "e" + i, sources: [e.from], targets: [e.to] }));
  const root = {
    id: "root",
    layoutOptions: {
      "elk.algorithm": "layered",
      "elk.direction": "DOWN",
      "elk.edgeRouting": "ORTHOGONAL",
      "elk.layered.spacing.nodeNodeBetweenLayers": "52",
      "elk.spacing.nodeNode": "30",
      "elk.spacing.edgeNode": "18",
      "elk.layered.considerModelOrder.strategy": "NODES_AND_EDGES",
      "elk.padding": "[top=38,left=22,bottom=22,right=22]",
    },
    children, edges,
  };
  const res = await elk.layout(root);
  const pos = {};
  (res.children || []).forEach(c => { pos[c.id] = { x: c.x + c.width / 2, y: c.y + c.height / 2, w: c.width, h: c.height }; });
  const routes = {};
  (res.edges || []).forEach(e => { routes[e.id] = (e.sections && e.sections[0]) || null; });
  return { pos, width: (res.width || 680) + 8, height: (res.height || 400) + 8, byId, fwd, routes };
}

// -- fallback: the original longest-path rank, used only if elkjs failed to load or
// threw. Same return shape as elkLayout (routes empty → draw falls back to beziers). --
function fallbackLayout(graph) {
  const nodes = graph.nodes, byId = {}; nodes.forEach(n => byId[n.id] = n);
  const fwd = graph.edges.filter(e => e.kind !== "loop-back");
  const succ = {}, indeg = {}; nodes.forEach(n => { succ[n.id]=[]; indeg[n.id]=0; });
  fwd.forEach(e => { if (byId[e.from] && byId[e.to]) { succ[e.from].push(e.to); indeg[e.to]++; } });
  const rank = {}; nodes.forEach(n => rank[n.id]=0);
  const q = nodes.filter(n => indeg[n.id]===0).map(n=>n.id);
  const din = {...indeg};
  while (q.length) {
    const u = q.shift();
    for (const v of succ[u]) { rank[v]=Math.max(rank[v], rank[u]+1); if (--din[v]===0) q.push(v); }
  }
  const rows = {}; nodes.forEach(n => { (rows[rank[n.id]] ||= []).push(n); });
  const COLW = 210, ROWH = 92, PADX = 40, PADY = 54;
  const maxRow = Math.max(1, ...Object.values(rows).map(r => r.length));
  const width = Math.max(680, PADX*2 + maxRow*COLW);
  const pos = {};
  Object.keys(rows).map(Number).sort((a,b)=>a-b).forEach(r => {
    const row = rows[r], k = row.length;
    row.forEach((n,i) => { pos[n.id] = { x: width*(i+1)/(k+1), y: PADY + r*ROWH, w: nodeW(n), h: NODE_H }; });
  });
  const height = PADY*2 + (Math.max(0,...Object.values(rank)))*ROWH + 30;
  return { pos, width, height, byId, fwd, routes: {} };
}

async function computeLayout(graph) {
  if (typeof ELK !== "undefined") {
    try { return await elkLayout(graph); }
    catch (e) { console.warn("elkjs layout failed; falling back to longest-path", e); }
  }
  return fallbackLayout(graph);
}

async function draw(graph) {
  GRAPH = graph;
  NODE_BY_STATE = {};
  const svg = el("svg"); svg.innerHTML = "";
  const { pos, width, height, fwd, routes } = await computeLayout(graph);
  svg.setAttribute("width", width); svg.setAttribute("height", height);
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);

  // arrowhead defs
  const defs = mk("defs");
  for (const [id,color] of [["arrow","#566"],["arrowl","#d29922"],["arrowp","#d2a8ff"]]) {
    defs.appendChild(mk("marker",
      {id, viewBox:"0 0 10 10", refX:9, refY:5, markerWidth:7, markerHeight:7, orient:"auto-start-reverse"},
      [mk("path",{d:"M0,0 L10,5 L0,10 z", fill:color})]));
  }
  svg.appendChild(defs);

  // phase bands (derived from laid-out node y-extents, layout-engine agnostic)
  const PHASE_COLOR = ["#58a6ff","#d2a8ff","#3fb950","#d29922","#f85149","#79c0ff"];
  graph.phases.forEach((ph,i) => {
    const ns = graph.nodes.filter(n => n.phase === ph).map(n => pos[n.id]).filter(Boolean);
    if (!ns.length) return;
    const ymin = Math.min(...ns.map(p=>p.y - p.h/2)) - 16, ymax = Math.max(...ns.map(p=>p.y + p.h/2)) + 14;
    const c = PHASE_COLOR[i % PHASE_COLOR.length];
    svg.appendChild(mk("rect",{class:"phaseband", x:6, y:ymin, width:width-12, height:ymax-ymin, rx:10, fill:c}));
    svg.appendChild(mk("text",{class:"phaselabel", x:16, y:ymin+15, fill:c}, [txt(ph)]));
  });

  // forward edges: ELK-routed orthogonal polylines (fallback: bezier center-to-center)
  const midOf = sec => { const pts = [sec.startPoint, ...(sec.bendPoints||[]), sec.endPoint]; return pts[Math.floor(pts.length/2)]; };
  fwd.forEach((e, i) => {
    const sec = routes["e" + i];
    const marker = (e.kind==="fork"||e.kind==="join"||e.kind==="supersede") ? "url(#arrowp)" : "url(#arrow)";
    let d, lx, ly;
    if (sec) {
      const pts = [sec.startPoint, ...(sec.bendPoints||[]), sec.endPoint];
      d = "M " + pts.map(p => `${p.x} ${p.y}`).join(" L ");
      const m = midOf(sec); lx = m.x + 6; ly = m.y - 3;
    } else {
      const a = pos[e.from], b = pos[e.to]; if (!a||!b) return;
      const ay = a.y + 22, by = b.y - 22, my = (ay+by)/2;
      d = `M ${a.x} ${ay} C ${a.x} ${my}, ${b.x} ${my}, ${b.x} ${by}`;
      lx = (a.x+b.x)/2; ly = my;
    }
    svg.appendChild(mk("path",{class:`edge ${e.kind}`, d, "marker-end":marker}));
    if (e.label) svg.appendChild(mk("text",{class:"edgelabel", x:lx, y:ly}, [txt(e.label)]));
  });

  // loop-back edges: manual bulge to the right, back up to the head (never ELK-routed)
  graph.edges.filter(e => e.kind === "loop-back").forEach(e => {
    const a = pos[e.from], b = pos[e.to]; if (!a||!b) return;
    const mx = Math.max(a.x,b.x) + 90;
    const d = `M ${a.x + a.w/2} ${a.y} C ${mx} ${a.y}, ${mx} ${b.y}, ${b.x + b.w/2} ${b.y}`;
    svg.appendChild(mk("path",{class:"edge loop-back", d, "marker-end":"url(#arrowl)"}));
    if (e.label) svg.appendChild(mk("text",{class:"edgelabel", x:mx+6, y:(a.y+b.y)/2}, [txt(e.label)]));
  });

  // nodes
  graph.nodes.forEach(n => {
    const p = pos[n.id]; if (!p) return;
    const w = p.w, h = p.h, x = p.x - w/2, y = p.y - h/2;
    const cls = "node " + n.kind + (SEL_NODE===n.id?" sel":"")
      + (n.kind==="action" && n.namespace ? " ns-"+n.namespace : "")
      + (n.supersede_target?" supersede":"");
    const g = mk("g", {class:cls, "data-id":n.id});
    if (n.state_id) { g.setAttribute("data-state", n.state_id); NODE_BY_STATE[n.state_id] = g; }
    const rectAttrs = {x, y, width:w, height:h, rx: n.kind==="controller"?10:8};
    if (n.supersede_target) rectAttrs["stroke-dasharray"] = "6 4";
    g.appendChild(mk("rect", rectAttrs));
    const raw = (n.kind==="controller"? "⧉ " : "") + n.label;
    const label = raw.length>26 ? raw.slice(0,25)+"…" : raw;
    g.appendChild(mk("text",{x:p.x, y:p.y-2, "text-anchor":"middle"}, [txt(label)]));
    let sub = "";
    if (n.kind==="action") sub = n.action_kind + (n.budget? " · $"+n.budget : "");
    else if (n.kind==="loop") sub = "↻ ≤"+n.max_iterations;
    else if (n.kind==="fork") sub = "parallel";
    else if (n.kind==="controller") sub = n.supersede_target ? "supersede target" : "controller";
    if (sub) g.appendChild(mk("text",{class:"sub", x:p.x, y:p.y+11, "text-anchor":"middle"}, [txt(sub)]));
    // selection is a class toggle, not a relayout — clicking never reflows the graph
    g.addEventListener("click", () => { selectNode(n); });
    svg.appendChild(g);
  });
  applyRunVis();                       // re-light any active/done states after a redraw
  LAST_GRAPH_SIG = graphSig(graph);
}
function txt(s){ return document.createTextNode(s); }
// A stable signature of what the graph DRAWS (nodes/edges/phases). The compiled
// graph is deterministic for unchanged YAML, so an equal signature means a redraw
// would produce the identical SVG — the refresh path skips it, killing the flash.
function graphSig(g){ return JSON.stringify({ n: g.nodes, e: g.edges, p: g.phases }); }
// Re-apply the current run's node highlights to the freshly built nodes, so a
// redraw (when the YAML really did change) doesn't drop the live tracking state.
function applyRunVis(){
  for (const state in RUN_VIS) {
    const g = NODE_BY_STATE[state];
    if (g) { g.classList.remove("active","done-ok","done-err"); g.classList.add(RUN_VIS[state]); }
  }
}

// Update selection in place: swap the .sel class and refresh the inspector, without
// re-running the (async) layout — clicking a node must not reflow the whole graph.
function selectNode(n) {
  SEL_NODE = n.id;
  document.querySelectorAll(".node.sel").forEach(g => g.classList.remove("sel"));
  const g = document.querySelector(`.node[data-id="${cssEsc(n.id)}"]`);
  if (g) g.classList.add("sel");
  inspect(n);
}

// One-line I/O wiring for an action node's title: strip the shelf prefix from each
// ref, call out shared-shelf refs separately — e.g. for github:generate_work_units:
// "procedure: [job] → [purpose, work_unit] (shared: none)".
function wiringOf(n){
  const strip = r => r.replace(/^[^.]+\./, "");
  const isShared = r => r.startsWith("shared.");
  const ins = n.inputs || [], outs = n.outputs || [];
  const shared = [...new Set(ins.concat(outs).filter(isShared).map(strip))];
  const fmt = a => a.filter(r => !isShared(r)).map(strip).join(", ");
  return `${n.action_kind}: [${fmt(ins)}] → [${fmt(outs)}] (shared: ${shared.join(", ") || "none"})`;
}

function inspect(n) {
  const rows = [];
  const kv = (k,v) => `<div class="kv"><div class="k">${k}</div><div class="v">${v}</div></div>`;
  const pills = a => a.map(x=>`<span class="pill">${x}</span>`).join("");
  const sub = n.kind === "action" ? wiringOf(n) : n.kind + (n.phase?" · phase "+n.phase:"");
  const title = `<div class="kv insp-title"><div class="v" style="font-size:14px;font-weight:600">${n.label}</div>
    <div class="k">${escapeHtml(sub)}</div></div>`;
  if (n.kind === "action") {
    rows.push(kv("action kind", n.action_kind));
    if (n.namespace) rows.push(kv("namespace", n.namespace));
    if (n.budget) rows.push(kv("budget bucket", n.budget));
    if (n.permission) rows.push(kv("permission allow", pills(n.permission) || "<i>deny-all</i>"));
    if (n.inputs) rows.push(kv("reads", `<ul class="io">${n.inputs.map(i=>`<li>${i}</li>`).join("")}</ul>`));
    // "writes" (deliverables/shared) are deliberately NOT shown here — a probe reveals
    // them as an actual before/after diff (see renderProbe's "shelf changes"), so the
    // inspector doesn't pre-announce declared outputs before the node has run.
  } else if (n.kind === "loop") {
    rows.push(kv("max iterations", n.max_iterations));
    if (n.exit_when) rows.push(kv("until (exit when)", `<code>${n.exit_when}</code>`));
    if (n.abort_when) rows.push(kv("abort when", `<code>${n.abort_when}</code>`));
    if (n.while_) rows.push(kv("while", `<code>${n.while_}</code>`));
  } else if (n.kind === "controller") {
    rows.push(kv("controller", n.controller || n.label));
    if (n.needs) rows.push(kv("service needs", pills(n.needs)));
    if (n.unresolved) rows.push(kv("note", "collapsed — no registry to expand its actions"));
    if (n.supersede_target)
      rows.push(kv("entered by", "<code>ctx.supersede</code> — a superseding state spawns this variation at run time, preempting the active plan (ADR-003 · #190). It lights up live only if a run routes into it."));
  }
  const attrs = rows.length
    ? `<details class="attr-fold" id="attrFold"${ATTR_OPEN ? " open" : ""}><summary>attributes</summary>
        <div class="attr-body">${rows.join("")}</div></details>`
    : "";
  el("insp").innerHTML = title + attrs + (n.kind === "action" ? probeForm(n) : "");
  const fold = el("attrFold"); if (fold) fold.addEventListener("toggle", () => { ATTR_OPEN = fold.open; });
  if (n.kind === "action") wireProbe(n);
}

function escapeHtml(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function escAttr(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function parseVal(s){ s = (s||"").trim(); if (!s) return undefined; try { return JSON.parse(s); } catch(e){ return s; } }

// -- contract-driven probe form: render typed controls from the DECLARED schema --
// (graph.schemas, authored in app/config/schemas/*.yml — one schema per shelf.key).
// Each field carries {name,type,required,description,enum,items,format,default,example,
// minimum,maximum}. The control, its validation and its coercion all derive from that.
function prefillOf(f){ return f.example !== undefined ? f.example : f.default; }
function fieldControl(ref, f){
  const req = f.required ? `<span class="req" title="required">*</span>` : "";
  const desc = f.description ? ` title="${escAttr(f.description)}"` : "";
  const tag = f.type + (f.items ? `[${f.items}]` : "");
  const label = f.name ? `<label${desc}>${escapeHtml(f.name)} <span class="tk">${tag}</span>${req}</label>` : "";
  const pre = prefillOf(f);
  const da = `data-ref="${escAttr(ref)}" data-key="${escAttr(f.name||"")}" data-kind="${f.type}"`
    + (f.items ? ` data-items="${escAttr(f.items)}"` : "");
  if (f.enum && f.enum.length){
    const opts = [`<option value=""></option>`].concat(f.enum.map(v => {
      const sel = (pre !== undefined && String(pre) === String(v)) ? " selected" : "";
      return `<option value="${escAttr(v)}"${sel}>${escapeHtml(v)}</option>`;
    })).join("");
    return `<div class="pf">${label}<select class="pfield" ${da}>${opts}</select></div>`;
  }
  if (f.type === "boolean")
    return `<div class="pf pf-inline">${label}<input class="pfield pf-bool" type="checkbox" ${da} ${pre?"checked":""}></div>`;
  if (f.type === "integer" || f.type === "number"){
    const step = f.type === "integer" ? "1" : "any";
    const mn = f.minimum != null ? ` min="${f.minimum}"` : "";
    const mx = f.maximum != null ? ` max="${f.maximum}"` : "";
    return `<div class="pf">${label}<input class="pfield" type="number" step="${step}"${mn}${mx} ${da} value="${escAttr(pre ?? "")}"></div>`;
  }
  if (f.type === "array"){
    const listy = (f.items === "string" || f.items === "integer" || f.items === "number");
    const txt = Array.isArray(pre) ? (listy ? pre.join("\n") : JSON.stringify(pre, null, 2)) : (pre !== undefined ? JSON.stringify(pre) : "");
    return `<div class="pf">${label}<textarea class="pfield" ${da} rows="2" placeholder="${listy?"one per line":"JSON array"}">${escapeHtml(txt)}</textarea></div>`;
  }
  if (f.type === "object" || f.type === "any"){
    const txt = pre !== undefined ? JSON.stringify(pre, null, 2) : "";
    return `<div class="pf">${label}<textarea class="pfield" ${da} rows="3" placeholder="JSON">${escapeHtml(txt)}</textarea></div>`;
  }
  if (f.format === "multiline")
    return `<div class="pf">${label}<textarea class="pfield" ${da} rows="2">${escapeHtml(pre ?? "")}</textarea></div>`;
  return `<div class="pf">${label}<input class="pfield" type="text" ${da} value="${escAttr(pre ?? "")}"></div>`;
}
function probeForm(n){
  const ins = n.inputs || [];
  if (!ins.length)
    var groups = `<div class="pf-none">no declared inputs — runs on an empty shelf</div>`;
  else groups = ins.map(ref => {
    const sc = schemaFor(ref);
    let mode, badge, body;
    if (sc && sc.type === "object" && sc.fields && sc.fields.length){
      mode = "object";
      badge = `<span class="pf-src" title="${escAttr(sc.description || "declared contract")}">◆ contract</span>`;
      body = sc.fields.map(f => fieldControl(ref, f)).join("");
    } else if (sc){
      mode = "scalar";
      badge = `<span class="pf-src" title="${escAttr(sc.description || "declared contract")}">◆ contract</span>`;
      body = fieldControl(ref, {name:"", type:sc.type, items:sc.items, enum:sc.enum, example:sc.example});
    } else {
      mode = "raw";
      badge = `<span class="pf-src raw" title="no declared contract for this ref">untyped</span>`;
      body = `<div class="pf"><textarea class="pfield" data-ref="${escAttr(ref)}" data-key="" data-kind="any" rows="2" placeholder="JSON or text"></textarea></div>`;
    }
    const rawJson = mode === "raw" ? "" :
      `<details class="pf-adv"><summary>edit as JSON</summary>
        <textarea class="pf-rawjson" data-ref="${escAttr(ref)}" rows="3" placeholder="overrides the fields above"></textarea></details>`;
    return `<div class="pgroup" data-ref="${escAttr(ref)}" data-mode="${mode}">
      <div class="pgroup-h"><span class="pgroup-ref">${escapeHtml(ref)}</span> ${badge}</div>
      ${body}${rawJson}<div class="pf-errs" data-ref="${escAttr(ref)}"></div></div>`;
  }).join("");
  return `<div class="probe">
    <div class="cap">probe</div>
    <div class="hint">Send test inputs through this state's declared contract and see what it returns and writes. Runs under the mock engine — dry-run, no side effects.</div>
    ${groups}
    <details class="pf-adv"><summary>payload (optional)</summary>
      <textarea id="probe-payload" rows="1" placeholder="JSON payload arg (most actions ignore it)"></textarea></details>
    <div class="probe-actions">
      <button type="button" class="probe-live" id="probe-live" title="Live: run against the real model (costs tokens, needs API keys)">• Live</button>
      <button class="probe-run" id="probe-run">▶ Probe Node</button>
    </div>
    <div class="probe-out" id="probe-out"></div>
  </div>`;
}

function coerceField(e){
  const kind = e.dataset.kind, items = e.dataset.items;
  if (kind === "boolean") return e.checked;
  if (kind === "integer") { const v = e.value.trim(); if (v === "") return undefined; const n = parseInt(v, 10); return isNaN(n) ? v : n; }
  if (kind === "number")  { const v = e.value.trim(); if (v === "") return undefined; const n = Number(v);      return isNaN(n) ? v : n; }
  if (kind === "array"){
    if (!e.value.trim()) return [];
    if (items === "string") return e.value.split("\n").map(s => s.trim()).filter(Boolean);
    if (items === "integer" || items === "number") return e.value.split("\n").map(s => s.trim()).filter(Boolean).map(Number);
    return parseVal(e.value);   // array of objects/any → JSON
  }
  if (kind === "object" || kind === "any") return parseVal(e.value);
  const v = e.value;   // string (incl. multiline)
  return v === "" ? undefined : v;
}
function collectInputs(){
  const inputs = {};
  document.querySelectorAll(".pgroup").forEach(g => {
    const ref = g.dataset.ref, mode = g.dataset.mode;
    const raw = g.querySelector(".pf-rawjson");        // whole-ref JSON override wins when filled
    if (raw && raw.value.trim()) { const v = parseVal(raw.value); if (v !== undefined) inputs[ref] = v; return; }
    const fields = [...g.querySelectorAll(".pfield")];
    if (mode === "object") {
      const obj = {};
      fields.forEach(e => { const val = coerceField(e); if (val !== undefined) obj[e.dataset.key] = val; });
      inputs[ref] = obj;
    } else if (fields[0]) {
      const val = coerceField(fields[0]); if (val !== undefined) inputs[ref] = val;
    }
  });
  return inputs;
}

// -- client mirror of ShelfSchema.validate (instant feedback; server is authoritative) --
function typeOk(v, t){
  if (t === "any" || !t) return true;
  if (t === "string")  return typeof v === "string";
  if (t === "integer") return typeof v === "number" && Number.isInteger(v);
  if (t === "number")  return typeof v === "number";
  if (t === "boolean") return typeof v === "boolean";
  if (t === "array")   return Array.isArray(v);
  if (t === "object")  return v && typeof v === "object" && !Array.isArray(v);
  return true;
}
function validateField(f, value, path){
  if (value === undefined || value === null) return [];
  if (!typeOk(value, f.type)) return [`${path}: expected ${f.type}`];
  const errs = [];
  if (f.enum && f.enum.length && !f.enum.map(String).includes(String(value)))
    errs.push(`${path}: ${JSON.stringify(value)} not in [${f.enum.join(", ")}]`);
  if (f.type === "number" || f.type === "integer"){
    if (f.minimum != null && value < f.minimum) errs.push(`${path}: ${value} < ${f.minimum}`);
    if (f.maximum != null && value > f.maximum) errs.push(`${path}: ${value} > ${f.maximum}`);
  }
  if (f.type === "array" && f.items) (value || []).forEach((it, i) => {
    if (!typeOk(it, f.items)) errs.push(`${path}[${i}]: expected ${f.items}`);
  });
  if (f.type === "object" && f.fields) f.fields.forEach(sub => {
    const present = value && Object.prototype.hasOwnProperty.call(value, sub.name);
    if (sub.required && !present) errs.push(`${path}.${sub.name}: required`);
    else if (present) errs.push(...validateField(sub, value[sub.name], `${path}.${sub.name}`));
  });
  return errs;
}
function validateInputs(inputs){
  const byRef = {};
  Object.entries(inputs).forEach(([ref, value]) => {
    const sc = schemaFor(ref);
    if (!sc) return;
    const errs = validateField({type:sc.type, items:sc.items, enum:sc.enum, fields:sc.fields}, value, ref);
    if (errs.length) byRef[ref] = errs;
  });
  return byRef;
}
function showFieldErrors(byRef){
  document.querySelectorAll(".pf-errs").forEach(d => { d.innerHTML = ""; d.parentElement.classList.remove("invalid"); });
  Object.entries(byRef || {}).forEach(([ref, errs]) => {
    const d = document.querySelector(`.pf-errs[data-ref="${cssEsc(ref)}"]`);
    if (d){ d.innerHTML = errs.map(e => `<div class="pf-err">✕ ${escapeHtml(e)}</div>`).join(""); d.parentElement.classList.add("invalid"); }
  });
}
function cssEsc(s){ return String(s).replace(/["\\]/g, "\\$&"); }

function wireProbe(n){
  const btn = el("probe-run"); if (!btn) return;
  // single live toggle — persisted in PROBE_LIVE across node clicks; on = glows red
  const liveBtn = el("probe-live");
  function applyMode(){ if (liveBtn) liveBtn.classList.toggle("on", PROBE_LIVE); }
  if (liveBtn) liveBtn.addEventListener("click", () => { PROBE_LIVE = !PROBE_LIVE; applyMode(); });
  applyMode();
  btn.addEventListener("click", async () => {
    const inputs = collectInputs();
    const clientErrs = validateInputs(inputs);
    showFieldErrors(clientErrs);      // instant, contract-checked feedback before the round trip
    const pv = parseVal((el("probe-payload")||{}).value);
    btn.disabled = true;
    el("probe-out").innerHTML = `<div class="muted">running ${n.label}${PROBE_LIVE ? " (live model)" : ""}…</div>`;
    try {
      const res = await (await fetch("/api/probe", {
        method: "POST", headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ workflow: SEL_WF, token: n.label, inputs, payload: pv, live: PROBE_LIVE })
      })).json();
      if (res.validation && Object.keys(res.validation).length) showFieldErrors(res.validation);  // authoritative
      el("probe-out").innerHTML = renderProbe(res);
    } catch(e) {
      el("probe-out").innerHTML = `<div class="perr">✕ ${escapeHtml(e)}</div>`;
    }
    btn.disabled = false;
  });
}

function renderProbe(r){
  if (r.error) return `<div class="perr">✕ ${escapeHtml(r.error)}</div>`;
  const j = o => `<pre class="pj">${escapeHtml(JSON.stringify(o, null, 2))}</pre>`;
  const has = o => o && (typeof o !== "object" || Object.keys(o).length);
  let h = "";
  if (r.validation && Object.keys(r.validation).length){
    const n = Object.values(r.validation).reduce((a, e) => a + e.length, 0);
    h += `<div class="pres err">⚠ ${n} contract violation${n===1?"":"s"}</div>`
      + `<div class="muted">inputs don't conform to the declared schema — see the fields above</div>`;
  }
  h += `<div class="pres ${r.ok ? "ok" : "err"}">${r.ok ? "✓ ok" : "✕ error"}</div>`;
  if (r.result && r.result.error) h += `<div class="plabel">error</div><div class="perr">${escapeHtml(r.result.error)}</div>`;
  // shelf changes: the before/after diff of deliverables + shared — the reason to probe.
  // Highlighted per shelf (deliverables vs shared) and tagged new/changed.
  if (r.changes && r.changes.length) {
    h += `<div class="plabel">shelf changes · deliverables + shared</div>`;
    h += r.changes.map(c => {
      const shelf = String(c.ref).split(".")[0];   // "deliverables" | "shared"
      return `<div class="shelf-change ${shelf}"><div class="sc-head">`
        + `<span class="sc-ref">${escapeHtml(c.ref)}</span>`
        + `<span class="sc-tag ${c.status}">${c.status}</span></div>`
        + `<pre class="pj">${escapeHtml(JSON.stringify(c.value, null, 2))}</pre></div>`;
    }).join("");
  } else if (r.ok) {
    h += `<div class="plabel">shelf changes · deliverables + shared</div>`
      + `<div class="muted">no changes to deliverables or shared</div>`;
  }
  if (r.result && r.result.value != null) h += `<div class="plabel">result.value</div>` + j(r.result.value);
  if (r.raised && r.raised.length) h += `<div class="plabel">raised events</div>` + j(r.raised);
  if (has(r.result && r.result.meta)) h += `<div class="plabel">meta</div>` + j(r.result.meta);
  if (r.seeded && r.seeded.length) h += `<div class="plabel">seeded</div><div class="muted">${r.seeded.map(escapeHtml).join(", ")}</div>`;
  return h;
}

async function loadWorkflowList() {
  const list = await (await fetch("/api/workflows")).json();
  const sel = el("wfsel"); sel.innerHTML = "";
  const box = el("wflist"); box.innerHTML = "";
  list.forEach(w => {
    if (w.ok) { const o = document.createElement("option"); o.value = w.name; o.textContent = w.name; sel.appendChild(o); }
    const d = document.createElement("div");
    d.className = "wf" + (w.name===SEL_WF?" sel":"");
    d.innerHTML = w.ok
      ? `<div class="n">${w.name}</div><div class="m">${w.node_count} states · ${w.phases.join(" → ")}</div>`
      : `<div class="n">${w.name}</div><div class="bad">✕ ${w.error}</div>`;
    if (w.ok) d.addEventListener("click", () => selectWorkflow(w.name));
    box.appendChild(d);
  });
  if (!SEL_WF && list.some(w=>w.ok)) SEL_WF = list.find(w=>w.ok).name;
  sel.value = SEL_WF || "";
}

async function selectWorkflow(name) {
  SEL_WF = name; SEL_NODE = null;
  stopStream(); CUR_RUN = null; RUN_VIS = {}; setStatus("idle", "idle");
  el("wfsel").value = name;
  document.querySelectorAll(".wf").forEach(d => d.classList.toggle("sel", d.querySelector(".n").textContent===name));
  el("insp").innerHTML = `<div class="placeholder">Click a state to inspect it.</div>`;
  const g = await (await fetch("/api/workflows/" + encodeURIComponent(name))).json();
  if (g.error) { el("svg").innerHTML=""; el("insp").innerHTML = `<div class="placeholder">${g.error}</div>`; return; }
  await draw(g);   // g.schemas rides along on the graph — the probe forms read it via schemaFor()
  updateRunButton();
}

async function refresh() {
  await loadWorkflowList();
  if (SEL_WF) await redrawCurrentWorkflow();
}

// Recompile the CURRENT workflow from YAML and redraw ONLY if the graph actually
// changed — without tearing down an in-flight run. This is both the manual "↻ refresh"
// and the "● live" auto-refresh path. Unchanged YAML => no redraw (no flashing SVG);
// and unlike selectWorkflow it never stops the SSE stream or clears run visuals, so a
// live session keeps being tracked while auto-refresh is on.
async function redrawCurrentWorkflow() {
  const g = await (await fetch("/api/workflows/" + encodeURIComponent(SEL_WF))).json();
  if (g.error) return;
  const svg = el("svg");
  if (svg.childElementCount && graphSig(g) === LAST_GRAPH_SIG) { updateRunButton(); return; }
  await draw(g);   // graph genuinely changed (YAML edited) — redraw, preserving run highlights
  updateRunButton();
}

function renderLegend() {
  const items = [["action","--node-action"],["controller","--node-ctrl"],["loop","--node-loop"],["parallel","--node-par"],["start","--node-start"],["end","--node-end"]];
  el("legend").innerHTML = "<span>states:</span>" +
    items.map(([k,c])=>`<span><span class="sw" style="background:var(${c})"></span>${k}</span>`).join("") +
    `<span><span class="sw" style="background:var(--edge-loop)"></span>loop-back</span>` +
    `<span><span class="sw" style="background:var(--node-supersede);border-color:var(--accent2);border-style:dashed"></span>supersede target</span>`;
}

async function loadSessions() {
  try {
    const s = await (await fetch("/api/sessions")).json();
    RUNNABLE = s.runnable || [];
    updateRunButton();
  } catch(e){}
}
function updateRunButton() {
  const b = el("runbtn");
  const canRun = SEL_WF && RUNNABLE.includes(SEL_WF);
  b.disabled = !canRun || (CUR_RUN && CUR_RUN.status === "running");
  b.title = canRun ? "Run this workflow under the mock engine and watch it live"
                   : `Only ${RUNNABLE.join(", ")} has a live mock runner; ${SEL_WF||"this"} is draw-only.`;
}
function setStatus(txt, cls) { const s = el("runstatus"); s.textContent = txt; s.className = "st " + cls; }
function logEvent(html) {
  const box = el("elog"); const d = document.createElement("div"); d.className = "ev"; d.innerHTML = html;
  box.appendChild(d); box.scrollTop = box.scrollHeight;
  while (box.childElementCount > 400) box.removeChild(box.firstChild);
}
function clearRunVisuals() {
  RUN_VIS = {};
  document.querySelectorAll(".node.active,.node.done-ok,.node.done-err")
    .forEach(g => g.classList.remove("active","done-ok","done-err"));
}
function shortState(s){ const p = s.split("/"); return p[p.length-1]; }

function stopStream() { if (ES) { ES.close(); ES = null; } }

// Open the SSE stream for a run (mock or attached-live) and wire node highlighting.
function openStream(run) {
  stopStream(); clearRunVisuals(); el("elog").innerHTML = "";
  CUR_RUN = run; updateRunButton();
  setStatus(`${run.id} · ${run.status || "running"}`, "running");
  ES = new EventSource(`/api/sessions/${encodeURIComponent(run.id)}/stream`);
  ES.onmessage = ev => handleRunEvent(JSON.parse(ev.data));
  ES.onerror = () => { /* stream closed; status event already handled the outcome */ };
}

async function runAndWatch() {
  if (!SEL_WF || !RUNNABLE.includes(SEL_WF)) return;
  setStatus("starting…", "running");
  let run;
  try {
    run = await (await fetch(`/api/sessions/run?workflow=${encodeURIComponent(SEL_WF)}`, {method:"POST"})).json();
  } catch(e) { setStatus("failed to start", "errored"); return; }
  if (run.error) { setStatus(run.error, "errored"); logEvent(`<span class="lv err">${run.error}</span>`); return; }
  openStream(run);
}

// -- external live runs: attach to a sidecar an out-of-process run is writing --
async function attachLive(id, workflow) {
  ATTACHED_ID = id;   // claim immediately so a concurrent poll's auto-attach doesn't double-fire
  // Match the drawn graph to the run's workflow, else the state ids won't map to nodes.
  if (workflow && workflow !== SEL_WF) await selectWorkflow(workflow);
  let run;
  try {
    run = await (await fetch("/api/sessions/attach", {
      method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ id })
    })).json();
  } catch(e) { ATTACHED_ID = null; setStatus("attach failed", "errored"); return; }
  if (run.error) { ATTACHED_ID = null; setStatus(run.error, "errored"); logEvent(`<span class="lv err">${run.error}</span>`); return; }
  openStream(run);
  logEvent(`<span class="lv">attached to live run <b>${escapeHtml(id)}</b></span>`);
}

// A run is "live" only if it says running AND its sidecar was touched recently. The
// writer heartbeats the mtime every ~15s (foundation.trace) even mid-inference, so a
// stale mtime means the writer is gone, not merely busy — 60s is a safe 4x margin.
const STALE_SECS = 60;
function isFreshRunning(r){
  return (r.status || "running") === "running"
    && (r.mtime == null || (Date.now() / 1000 - r.mtime) < STALE_SECS);
}
// Auto-follow the newest actively-running external run so a live session tracks
// itself. Never hijacks a stream in progress, and never re-attaches the same one.
function maybeAutoAttach(runs) {
  if (!AUTO_ATTACH || ES) return;              // disabled, or already streaming — leave it
  const live = runs.find(isFreshRunning);       // runs are newest-first → freshest running
  if (!live || live.id === ATTACHED_ID) return;
  attachLive(live.id, live.workflow);
}

async function loadLiveRuns() {
  let runs = [];
  try { runs = ((await (await fetch("/api/sessions/live")).json()).runs) || []; } catch(e) { return; }
  const box = el("liveruns"); if (!box) return;
  if (!runs.length) {
    box.innerHTML = `<div class="muted small">No live runs detected. Start an external session (e.g. <code>oneshot … --live</code>) — it writes a sidecar the viewer tails here.</div>`;
    return;
  }
  box.innerHTML = runs.map(r => {
    const st = r.status || "running";
    return `<div class="liverun" data-id="${escAttr(r.id)}" data-wf="${escAttr(r.workflow||'')}">`
      + `<div class="lr-main"><span class="lr-id">${escapeHtml(r.id)}</span><span class="st ${st}">${st}</span></div>`
      + `<div class="lr-sub">${escapeHtml(r.workflow||'?')} · ${r.events||0} events</div></div>`;
  }).join("");
  box.querySelectorAll(".liverun").forEach(d =>
    d.addEventListener("click", () => attachLive(d.dataset.id, d.dataset.wf)));
  maybeAutoAttach(runs);
}
let liveTimer = null;
function startLivePolling(){ loadLiveRuns(); if (!liveTimer) liveTimer = setInterval(loadLiveRuns, 3500); }
function stopLivePolling(){ if (liveTimer) { clearInterval(liveTimer); liveTimer = null; } }

function handleRunEvent(e) {
  const t = (e.t!=null) ? `<span class="t">${e.t.toFixed(2)}s</span> ` : "";
  if (e.type === "enter") {
    RUN_VIS[e.state] = "active";
    const g = NODE_BY_STATE[e.state];
    if (g) { g.classList.add("active"); g.classList.remove("done-ok","done-err"); }
    if (e.kind === "leaf" || e.kind === "loop")
      logEvent(`${t}<span class="en">→ ${shortState(e.state)}</span>`);
  } else if (e.type === "leave") {
    RUN_VIS[e.state] = e.ok ? "done-ok" : "done-err";
    const g = NODE_BY_STATE[e.state];
    if (g) { g.classList.remove("active"); g.classList.add(e.ok ? "done-ok" : "done-err"); }
  } else if (e.type === "event") {
    logEvent(`${t}<span class="lv ${e.ok===false?'err':''}">· ${e.event||''} ${e.ok===false?'✕':''}</span>`);
  } else if (e.type === "error") {
    logEvent(`${t}<span class="lv err">✕ ${e.message||''}</span>`);
  } else if (e.type === "status") {
    const cls = e.status === "succeeded" ? "succeeded" : (e.status==="running"?"running":"errored");
    setStatus(`${CUR_RUN?CUR_RUN.id:''} · ${e.status}`, cls);
    if (["succeeded","failed","errored","stopped"].includes(e.status)) {
      logEvent(`${t}<span class="ok">■ ${e.status}</span>`);
      stopStream(); if (CUR_RUN) CUR_RUN.status = e.status; updateRunButton();
    }
  }
}

el("refresh").addEventListener("click", refresh);
el("runbtn").addEventListener("click", runAndWatch);
el("wfsel").addEventListener("change", e => selectWorkflow(e.target.value));
el("auto").addEventListener("click", () => {
  const b = el("auto");
  if (autoTimer) { clearInterval(autoTimer); autoTimer=null; b.classList.remove("on"); }
  else { autoTimer = setInterval(refresh, 3000); b.classList.add("on"); }
});

// -- inspector resize: drag the handle to widen/narrow, double-click to reset --
const INSP_MIN = 260, INSP_DEFAULT = 300;
function setInspWidth(px) {
  const max = Math.max(INSP_MIN, window.innerWidth - 420);   // keep the canvas usable
  const w = Math.min(max, Math.max(INSP_MIN, px));
  document.documentElement.style.setProperty("--insp-w", w + "px");
  try { localStorage.setItem("dbg-insp-w", String(w)); } catch(e) {}
}
(function wireResize(){
  const h = el("inspResize"); if (!h) return;
  let dragging = false;
  h.addEventListener("mousedown", e => { dragging = true; document.body.classList.add("resizing"); e.preventDefault(); });
  window.addEventListener("mousemove", e => { if (dragging) setInspWidth(window.innerWidth - e.clientX); });
  window.addEventListener("mouseup", () => { if (dragging) { dragging = false; document.body.classList.remove("resizing"); } });
  h.addEventListener("dblclick", () => setInspWidth(INSP_DEFAULT));
  const saved = parseInt(localStorage.getItem("dbg-insp-w") || "", 10);
  if (saved) setInspWidth(saved);
})();

// -- left sidebar resize: drag the handle on its right edge; double-click to reset --
const SIDE_MIN = 180, SIDE_DEFAULT = 232;
function setSideWidth(px) {
  const max = Math.max(SIDE_MIN, Math.min(480, window.innerWidth - 500));  // keep canvas + inspector usable
  const w = Math.min(max, Math.max(SIDE_MIN, px));
  document.documentElement.style.setProperty("--side-w", w + "px");
  try { localStorage.setItem("dbg-side-w", String(w)); } catch(e) {}
}
(function wireSideResize(){
  const h = el("sideResize"); if (!h) return;
  let dragging = false;
  h.addEventListener("mousedown", e => { dragging = true; document.body.classList.add("resizing"); e.preventDefault(); });
  window.addEventListener("mousemove", e => { if (dragging) setSideWidth(e.clientX); });  // sidebar starts at x=0 → width = clientX
  window.addEventListener("mouseup", () => { if (dragging) { dragging = false; document.body.classList.remove("resizing"); } });
  h.addEventListener("dblclick", () => setSideWidth(SIDE_DEFAULT));
  const saved = parseInt(localStorage.getItem("dbg-side-w") || "", 10);
  if (saved) setSideWidth(saved);
})();

// -- live sessions panel: always polling (a live session must surface with no digging),
// plus the auto-attach toggle and the collapsed mock-runner fold. --
(function wireSessions(){
  try { if (localStorage.getItem("dbg-autoattach") === "0") AUTO_ATTACH = false; } catch(e) {}
  const ab = el("autoattach");
  if (ab) {
    ab.classList.toggle("on", AUTO_ATTACH);
    ab.addEventListener("click", () => {
      AUTO_ATTACH = !AUTO_ATTACH;
      ab.classList.toggle("on", AUTO_ATTACH);
      try { localStorage.setItem("dbg-autoattach", AUTO_ATTACH ? "1" : "0"); } catch(e) {}
    });
  }
  const rb = el("liverefresh");
  if (rb) rb.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); loadLiveRuns(); });
  const m = el("mockFold");
  if (m) {
    try { if (localStorage.getItem("dbg-mock-fold") === "open") m.open = true; } catch(e) {}
    m.addEventListener("toggle", () => { try { localStorage.setItem("dbg-mock-fold", m.open ? "open" : "closed"); } catch(e) {} });
  }
  startLivePolling();
})();

// -- light / dark theme toggle (persisted) --
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  const b = el("theme"); if (b) b.textContent = (t === "light") ? "☀ light" : "☾ dark";
  try { localStorage.setItem("dbg-theme", t); } catch(e) {}
}
el("theme").addEventListener("click", () =>
  applyTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light"));
applyTheme(localStorage.getItem("dbg-theme") || "dark");

renderLegend();
loadSessions();
refresh();
</script>
