# ===========================================================================
# litellm.pipeline.yaml — model plane for the pipeline (HANDOFF §5.2)
#
# Consumed by the ALREADY-RUNNING LiteLLM proxy:
#     litellm --config config/litellm.pipeline.yaml
#
# This file only declares model GROUPS the pipeline routes to. It invents no
# serving infra. Local open-weight serving is MLX (or hosted) — never local
# PyTorch — because flagship MoE weights exceed local memory (HANDOFF §5.2).
#
# Env substitution uses LiteLLM's `os.environ/VAR` form; fill values in
# pipeline.env. Hosted open-weight models (DeepSeek/Kimi) appear ONLY as
# OpenAI-compatible endpoints and are commented-out stubs until a key is set.
# ===========================================================================

model_list:
  # --- triage: cheap, fast intake reasoning. Local MLX Qwen3-Coder. ---------
  - model_name: triage
    litellm_params:
      model: os.environ/MLX_QWEN_MODEL
      api_base: os.environ/MLX_QWEN_BASE_URL
      api_key: os.environ/MLX_QWEN_API_KEY
    model_info:
      pipeline_role: "intake reasoning; fallback -> haiku-tier"

  # --- distill: CI-log -> failure brief. Same backend as triage. ------------
  - model_name: distill
    litellm_params:
      model: os.environ/MLX_QWEN_MODEL
      api_base: os.environ/MLX_QWEN_BASE_URL
      api_key: os.environ/MLX_QWEN_API_KEY
    model_info:
      pipeline_role: "CI log distillation into a failure brief"

  # --- gen-local: bounded mechanical generation. MLX Qwen3-Coder. -----------
  - model_name: gen-local
    litellm_params:
      model: os.environ/MLX_QWEN_MODEL
      api_base: os.environ/MLX_QWEN_BASE_URL
      api_key: os.environ/MLX_QWEN_API_KEY
    model_info:
      pipeline_role: "bounded mechanical work; fix-ladder tier 1"

  # --- gen-default: implementation default. Sonnet-tier Anthropic. ----------
  - model_name: gen-default
    litellm_params:
      model: os.environ/ANTHROPIC_DEFAULT_MODEL
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      pipeline_role: "implementation default; fix-ladder tier 2"

  # --- gen-frontier: planning + attempt-3 fixes. Opus-tier Anthropic. -------
  - model_name: gen-frontier
    litellm_params:
      model: os.environ/ANTHROPIC_FRONTIER_MODEL
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      pipeline_role: "planning + hard fixes; fix-ladder tier 3"

  # --- haiku-tier: cheap tier for the daily digest + triage fallback. -------
  - model_name: haiku-tier
    litellm_params:
      model: os.environ/ANTHROPIC_HAIKU_MODEL
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      pipeline_role: "daily digest agent turn; triage/distill fallback"

  # --- critic: adversarial reviewer, cross-family vs the generator. ---------
  # Default backend is Anthropic; cross-family selection (route OPPOSITE of the
  # generator's `route`) is done by critic_route() in scripts/lib/common.sh,
  # which picks a different gen-* group at call time.
  - model_name: critic
    litellm_params:
      model: os.environ/ANTHROPIC_DEFAULT_MODEL
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      pipeline_role: "default critic; cross-family routing via critic_route()"

  # ----------------------- STUBS (HANDOFF §9) -------------------------------
  # Hosted open-weight, OpenAI-compatible. Activate by uncommenting and adding
  # the key to pipeline.env. Kept out of the live plane in v0.
  #
  # - model_name: gen-deepseek
  #   litellm_params:
  #     model: openai/deepseek-chat
  #     api_base: https://api.deepseek.com
  #     api_key: os.environ/DEEPSEEK_API_KEY
  #   model_info:
  #     pipeline_role: "hosted open-weight generator (STUB)"
  #
  # - model_name: gen-kimi
  #   litellm_params:
  #     model: openai/moonshot-v1-128k
  #     api_base: https://api.moonshot.cn/v1
  #     api_key: os.environ/MOONSHOT_API_KEY
  #   model_info:
  #     pipeline_role: "hosted open-weight generator (STUB)"

# Route around a cold/unavailable local endpoint without failing the job.
router_settings:
  fallbacks:
    - triage: ["haiku-tier"]
    - distill: ["haiku-tier"]
    - gen-local: ["gen-default"]

litellm_settings:
  drop_params: true
  num_retries: 2
  request_timeout: 120

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
