# selection-weights.yml — data-driven priority weights for issue selection.
#
# Consumed by src/intake/ranker.py (priority_key). Edit this file to retune
# selection ordering without touching Python. Override the path with the env var
# DISPATCH_SELECTION_WEIGHTS. A missing/corrupt file falls back to these same
# defaults in code, so the pipeline always has a usable shape.
#
# Ordering among ready (dispatchable) issues, in precedence:
#   dependency depth (foundational first — a correctness constraint, not tunable)
#     -> then the tunable `sort` precedence below (leaf-before-feature, earlier
#        milestone, earlier iteration, the bugs-first issue-type dial, lower issue
#        number, higher label weight).
# The dependency-depth primary key is hard-wired in ranker.priority_key; the
# `sort` list defines everything after it.
#
# label_weights: maturity-ladder weight per issue label; HIGHER dispatches first.
# Mirrors the repo label scheme (Unscheduled -> Draft -> Candidate -> Release)
# with Blocker as the top overlay. An issue's weight is the max over its labels;
# labels not listed here weigh 0. Matching is case-insensitive.
label_weights:
  blocker: 4
  release: 3
  candidate: 2
  draft: 1
  unscheduled: 0

# type_weights: issue-TYPE priority dial — the bugs-vs-features knob. HIGHER
# dispatches first, folded in ahead of the issue-number tie-break so a ready bug
# outranks a same-maturity, same-depth enhancement instead of losing to the
# oldest issue number. Default is bugs-first (stabilize before extending); flip
# `bug` and a feature type for a feature-push sprint. An issue's weight is the
# max over its labels; labels not listed weigh 0. Matching is case-insensitive.
type_weights:
  bug: 3
  enhancement: 0
  feature: 0

# feature_labels: labels that mark an issue as a container (feature/epic) rather
# than a unit of work; containers sort AFTER leaves. Title "[Epic] ..." also
# counts. Case-insensitive.
feature_labels:
  - epic
  - feature

# sort: the TUNABLE selection precedence, as an ordered list of sort keys applied
# AFTER the hard-wired primary key (dependency depth, foundational-first — a
# correctness constraint, never listed here and never reorderable). priority_key
# builds its sort tuple by walking this list top-to-bottom; earlier entries
# dominate. The matchers/extractors stay in Python (src/intake/ranker.py); only
# this ordering/precedence is data.
#
# Each entry:
#   signal:    which Python extractor produces the value (see ranker._SIGNALS):
#                feature_last  0=leaf, 1=feature/epic container  (leaves first)
#                milestone     structured (year, seq) milestone key (earlier first)
#                iteration     structured (year, seq) iteration key (earlier first)
#                type_weight   max issue-TYPE weight — the bugs-first dial (higher first)
#                issue_number  the issue number (lower first = creation order)
#                label_weight  max maturity-ladder label weight (higher first)
#   direction: "asc" (smaller value sorts first) or "desc" (larger value first).
#                Implemented by negating the extracted value for "desc".
#
# NOTE the order below reproduces today's exact tuple precedence: issue_number
# precedes label_weight (label weight is the FINAL tie-break only, so the
# earliest issue — the foundation — wins over a late high-weight leaf).
sort:
  - {signal: feature_last, direction: asc}   # leaves before features/epics
  - {signal: milestone,    direction: asc}   # earlier milestone first
  - {signal: iteration,    direction: asc}   # earlier iteration first
  - {signal: type_weight,  direction: desc}  # bugs-first dial (#138) — before the number tie-break
  - {signal: issue_number, direction: asc}   # lower issue number (created earlier)
  - {signal: label_weight, direction: desc}  # higher label weight (final tie-break)
