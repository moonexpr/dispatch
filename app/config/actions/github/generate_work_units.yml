# A1 — read the work unit from the issue and classify its purpose (drives the
# engineering harness). A judgment, so an inference (oracle-backed under mock).
token: github:generate_work_units
kind: procedure
bind: generate_work_units
permission: []                  # deny-by-default
budget: architect
interface:
  in:
    job: input.job
  out:
    purpose: deliverables.purpose
    work_unit: deliverables.work_unit
