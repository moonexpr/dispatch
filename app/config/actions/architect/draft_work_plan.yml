# A7 — the structured work plan (invariants, assumptions, acceptance criteria,
# abort conditions, issues affected, bucket, UML for B|C, authorization). Emitted
# as JSON (fmt), so the inference carries a JSON adapter.
#
# An INFERENCE: under ArchitectFactory (baseworkflow's production factory) the LIVE
# runner drives a real Claude agent (foundation.agent_sdk) to arrange the epic's work
# units and assign an engineer agent that commits to each, layered on the
# deterministic baseline. The `bind: draft_work_plan` body is the dry-run/mock
# ORACLE (compiled in by CompileVisitor), so offline + CI stay byte-identical and
# any live model/parse failure falls back to it. Non-raw: the oracle writes
# work_plan via the interface; the live runner writes it itself.
token: architect:draft_work_plan
kind: inference
fmt: json
bind: draft_work_plan
permission: []
budget: architect
interface:
  in:
    job: input.job
    triage: input.triage
    plan: deliverables.plan
    bucket: deliverables.bucket
    budget: deliverables.budget
    strategy: deliverables.strategy
    # The intake -> research -> spec hand-off (final intake dossier, research
    # dossier, agent-team roster + per-slice assignments). Inside the
    # work-plan-review loop the prior round's admin gap notes
    # (deliverables.plan_review) are a cross-iteration read, via ctx.
    intake: deliverables.intake_dossier
    research: deliverables.research
    teams: deliverables.teams
    team_assignments: deliverables.team_assignments
  out:
    work_plan: deliverables.work_plan
