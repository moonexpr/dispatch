# tuning.yml — declarative tuning surface for the dispatch pipeline.
# Converted from the legacy src/tuning.json (#142). Edit values here to fine-tune
# WORK SELECTION and PROMPT GENERATION without touching Python. Loaded + validated
# by src/tuning.py via engine.filesys (deep-merged over the in-code DEFAULTS).
# Keys beginning with '_' are documentation and ignored by the loader.
# A typo'd key or malformed file now fails LOUD at load (#156), not silent-fallback.
_doc: 'Declarative tuning surface for the dispatch pipeline. Edit values here to fine-tune WORK SELECTION
  (which issue is picked) and PROMPT GENERATION (how the work order reads) without touching Python. Loaded
  by src/tuning.py, which deep-merges this file over baked-in defaults — so a missing or partial file
  still works (and reproduces current behavior). Keys beginning with ''_'' are documentation and ignored
  by the loader. Override the file path with the DISPATCH_TUNING_FILE env var. Determinism is a hard requirement:
  changing a value changes the work order, but two runs with the same config stay byte-identical.'
selection:
  _doc: 'Knobs that decide WHICH issue gets worked: the classifier''s triage signals and the ranker''s
    dependency parse.'
  classify:
    _doc: 'Deterministic keyword triage. hints: substrings (lowercased match) that signal scope/action.
      conf: the confidence formula weights. scope_route: scope -> generation route.'
    hints:
      xs:
      - typo
      - rename
      - comment
      - one-line
      - one line
      - wording
      - docstring
      - lint
      - format
      s:
      - add a flag
      - small
      - minor
      - tweak
      - adjust
      - bump version
      l:
      - refactor
      - redesign
      - architecture
      - migration
      - rewrite
      - overhaul
      - multi-service
      - breaking change
      wontdo:
      - wontfix
      - won't do
      - wont do
      - by design
      - not planned
      dup:
      - duplicate
      - dupe
      - already reported
      - 'same as #'
      vague:
      - not sure
      - maybe
      - somehow
      - investigate
      - unclear
      - '?'
      - thoughts
      - discuss
    conf:
      _doc: conf = base + scope_signal_weight*min(#scope-hints, scope_signal_cap) + (body_long_bonus if
        len(body)>=body_long_threshold) - vague_weight*min(#vague-hints, vague_cap) - (body_short_penalty
        if len(body)<body_short_threshold); clamped to [clamp_min, clamp_max], rounded to round_ndigits.
        A 'duplicate?' action is then capped at dup_cap.
      base: 0.6
      scope_signal_weight: 0.1
      scope_signal_cap: 3
      body_long_bonus: 0.1
      body_long_threshold: 80
      vague_weight: 0.12
      vague_cap: 3
      body_short_penalty: 0.15
      body_short_threshold: 25
      clamp_min: 0.05
      clamp_max: 0.99
      round_ndigits: 4
      dup_cap: 0.5
    scope_route:
      xs: gen-local
      s: gen-local
      m: gen-default
      l: gen-frontier
    vocab:
      _doc: 'Controlled vocabularies (the TriageResult enums) — which actions/scopes/routes are valid.
        Content only; the classification LOGIC stays in src/classifier/classify.py. epic_prefix is the
        (lowercased) title marker that flags an [Epic] container issue for decomposition.'
      actions:
      - implement
      - needs-human
      - wont-do
      - duplicate?
      - decompose
      scopes:
      - xs
      - s
      - m
      - l
      routes:
      - gen-local
      - gen-default
      - gen-frontier
      epic_prefix: '[epic]'
  ranker:
    _doc: 'Offline deterministic dependency parse. Regexes (each with one (\d+) capture group) that find
      issue cross-references in title+body. Markdown emphasis is stripped and matching is MULTILINE before
      these apply. fwd = ''this issue depends on #N'' (incl. an epic body task-listing a constituent ''-
      [ ] #N''). rev = ''this issue unblocks/blocks #N'' (=> #N depends on this issue) — incl. a child
      naming its ''parent epic: #N'', which makes the epic depend on (rank after) the child.'
    fwd_patterns:
    - blocked\s+by\s+#(\d+)
    - depends?\s+on\s+#(\d+)
    - requires?\s+#(\d+)
    - needs\s+#(\d+)
    - follow[-\s]?up\s+to\s+#(\d+)
    - prerequisite:?\s*#(\d+)
    - after\s+#(\d+)
    - ^\s*[-*]\s*\[[ xX]\]\s*#(\d+)
    rev_patterns:
    - unblocks?:?\s*(?:issue\s*)?#(\d+)
    - blocks?\s+#(\d+)
    - prerequisite\s+for\s+#(\d+)
    - parent\s+epic:?\s*#(\d+)
generation:
  _doc: 'Knobs that shape the emitted work order: budgets, decomposition/staffing, embedded resources,
    and rendering.'
  approval:
    _doc: 'scope_budget: total tokens ADMIN authorizes per scope. phase_split: [phase, fraction] pairs;
      the remainder (~0.20) is held as contingency reserve.'
    scope_budget:
      xs: 20000
      s: 40000
      m: 80000
      l: 160000
    phase_split:
    - - READ
      - 0.15
    - - IMPLEMENT
      - 0.45
    - - VERIFY
      - 0.12
    - - COMMIT & PR
      - 0.08
  decompose:
    _doc: 'swarm_max: hard cap on agents (= number of units). specialization_rules: ordered; first matching
      rule names the unit''s specialist as ''<domain> <function>''. A rule fires if ANY condition in ''any''
      is true; an ''all_of'' condition is an AND group. Conditions match the lowercased repo-relative
      path (path_*) or its basename (basename_*). The final rule has "default": true.'
    swarm_max: 15
    complexity:
      _doc: 'Complexity-aware staffing (#134). Number of IMPLEMENTATION slices a job splits into scales
        with signals ALREADY on the item (scope, labels, body length) — never new intake data (#132/#133).
        scope_slices: base slices by triage scope (xs/s/m stay 1 => zero change for small work; l/xl earn
        more). label_slice_bonus: extra slices per label whose name CONTAINS a key (summed). deep_bug_labels:
        substrings marking a hard bug — they add a diagnosis phase + 1 bonus slice. thread_depth_*: a body-length
        proxy for thread depth — one extra slice per N chars, capped. diagnosis_min_slices: emit a distinct
        DIAGNOSIS unit when slices reach this (or a deep-bug label is present). All counts are capped at swarm_max.'
      scope_slices:
        xs: 1
        s: 1
        m: 1
        l: 2
        xl: 3
      label_slice_bonus:
        epic: 2
        deep-bug: 1
      deep_bug_labels:
      - bug
      - regression
      - crash
      - defect
      - race
      thread_depth_chars_per_slice: 1200
      thread_depth_max_bonus: 2
      diagnosis_min_slices: 2
    specialization_rules:
    - any:
      - basename_contains: smoke
      - path_contains: test
      - path_contains: /fixtures/
      function: engineer
      domain: QA / test automation
    - any:
      - basename_endswith: .sh
      - path_startswith: scripts/
      function: engineer
      domain: developer tooling (shell)
    - any:
      - path_startswith: schemas/
      - all_of:
        - basename_endswith: .json
        - path_contains: schema
      function: engineer
      domain: data contracts / schema
    - any:
      - path_startswith: .github/
      - basename_startswith: ci
      function: engineer
      domain: CI/CD
    - any:
      - basename_endswith: .md
      - basename_equals: claude.md
      function: writer
      domain: developer documentation
    - any:
      - path_startswith: src/intake/
      function: engineer
      domain: data-pipeline (Python)
    - any:
      - path_startswith: src/classifier/
      function: engineer
      domain: ML / classification (Python)
    - any:
      - path_startswith: engine/models
      function: engineer
      domain: LLM integration (Python)
    - any:
      - path_startswith: src/architect/
      function: engineer
      domain: orchestration (Python)
    - any:
      - basename_endswith: .py
      - path_startswith: src/
      function: engineer
      domain: backend (Python)
    - default: true
      function: engineer
      domain: general software
  resources:
    _doc: 'Caps for the self-contained embedding. max_files: referenced files embedded (rest are listed,
      not embedded). cap_bytes: bytes per referenced file. contract_cap / schema_cap: bytes for CLAUDE.md
      and the invoice schema.'
    max_files: 6
    cap_bytes: 6000
    contract_cap: 4000
    schema_cap: 4000
  workorder:
    _doc: Rendering knobs. route_alias maps a route to the model alias used by the opt-in --llm sharpen
      path. box_width is the header box width in columns.
    route_alias:
      gen-local: local
      gen-default: sonnet
      gen-frontier: opus
    box_width: 70
  research:
    _doc: Research-mode gap-detection + order emission (Pillar 2, E6-1/E6-2). detect_gap() reads enabled/low_confidence_threshold/needs_research_label;
      the architect renders a research work order on the cheap `route` when a gap is found. enabled=false
      is a clean kill-switch (always needs_research=false).
    enabled: true
    low_confidence_threshold: 0.55
    needs_research_label: needs-research
    route: gen-local
    dispatch_enabled: false
budget:
  _doc: 'Operator-committed budget reconciliation for the soft-cap guard (E5-3). Resolves brainstorm Q3-residual
    (issue #48).'
  window:
    _doc: Claude Code usage-window the guard reconciles against. plan_tier ∈ pro|max5|max20|custom. window_token_limit
      is the resolved 5h-window token cap (the integer for a fixed tier, or the 'p90' marker for custom
      — resolved from the P90 of the last 192h of actual usage). soft_cap_fraction is the fraction of
      the limit at which a tick auto-flips to dry-run.
    plan_tier: max20
    window_token_limit: 220000
    soft_cap_fraction: 0.8
  plan_limits:
    _doc: Canonical per-5h-window token caps by plan tier (D2). The oracle (E5-1/#38) resolves limit_tokens
      from window.window_token_limit when set, else from this table; 'custom' resolves from custom_limit_tokens
      (or claude-monitor's P90).
    pro: 44000
    max5: 88000
    max20: 220000
  custom_limit_tokens: 0
recovery:
  _doc: 'Operator-committed crash-recovery policy for the cron reaper (E1-3). Resolves brainstorm Q6 (issue
    #49).'
  reaper_timeout_hours: 4
  engineer_failure_policy: architect-rescaffold
  _engineer_failure_policy_doc: 'On engineer non-zero exit / ''failed'' status mid-tick: re-submit the
    issue to the ARCHITECT for re-scaffolding and decomposition (a fresh, possibly finer-grained work
    order) rather than retrying the identical work order or escalating immediately. Escalate to needs-human
    only if re-scaffolding does not yield a workable plan. Distinct from the CI fix-ladder (which, per
    #137, now feeds the CI failure back as a revised diagnose-then-replan directive on each attempt —
    alongside the tier escalation — rather than retrying the identical work order) and from the reaper
    timeout above (which recovers silently crashed/stuck ''claimed'' issues).'
