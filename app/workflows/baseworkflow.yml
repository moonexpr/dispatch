# baseworkflow.yml — the work-unit lifecycle, expressed as configuration.
#
# This is the lean "population" file (Valve #base style): it composes namespaced
# action tokens into phases. Each token is defined by its own interface-rule file
# under actions/<namespace>/<name>.yml (pulled in by `uses:`), where the action's
# kind, governors and I/O contract live. End users edit this file and the action
# files — no Python. Validate with:  python -m foundation.workflow app/workflows/baseworkflow.yml
name: baseworkflow

uses:
  # Action manifests stay under app/config/actions/; this workflow now lives in
  # app/workflows/, so the include reaches back into config/ (resolved relative to
  # this file's directory).
  - ../config/actions/**/*.yml  # #base-style include of every action interface file

inputs: [request, job, triage]  # provided at run time (seeded onto the input shelf)

# The parties to the contract (ADR-003): controllers the workflow references —
# including the seed variants, which are never phase-referenced (they enter
# dynamically, superseding the seed controller's processing) — so the aggregate
# needs surface is complete and statically checkable:
#   python3 -m foundation.workflow app/workflows/baseworkflow.yml \
#     --registry baseworkflow.bindings:build_registry \
#     --services baseworkflow.services:build_mock_services --needs
controllers:
  - seed.intake
  - seed.handle.github
  - seed.handle.interactive
  - seed.handle.job

# Early completion (ADR-003): when the seed controller did NOT hand the request
# off to a variant (rejected job, unroutable source), its fallback records a
# `decision` deliverable and the lifecycle completes there — spec/work/build
# never run for a request that was never accepted.
terminal_when: seed_unrouted

seed:                           # static input-shelf values
  config:
    engineering_budget: 450000
    verify_cmd: "bash scripts/smoke.sh"

budgets:                        # named budget buckets (unit = tokens, placeholder)
  total: 1000000
  architect: 450000
  engineering: 450000
  admin: 100000

admin_spec_split: 0.5           # API-compat knob; does not affect the wiring

phases:

  # seed — the workflow now STARTS with the seed controller (ADR-003), a
  # controller REFERENCE (the three-layer discipline: this file names the
  # party; baseworkflow/bindings/seed.py owns the coordination; the seed:*
  # action interfaces own the plumbing). The kernel initializes it by seeding
  # `input.request` — a GitHub issue, an operator interaction, or a
  # non-interactive job request. On acceptance the seed spawns the matching
  # variation of itself and SUPERSEDES its own processing with it (#190);
  # every variant converges on the source-agnostic work_item (#188).
  seed:
    - controller: seed.intake

  # spec — the Architect's A1-A8 plus the Administrator's initial work. decompose
  # (A3) runs before strategy (A2): the strategy resolver reads the plan.
  spec:
    - github:generate_work_units
    - architect:decompose_phases
    - architect:classify_strategy
    - architect:select_bucket
    - budget:compute
    - architect:author_orchestration
    - budget:scope_orchestration
    - architect:draft_work_plan
    - architect:submit
    - admin:prepare_env
    - admin:write_adversarial

  # work — execute the orchestration script (a nested statechart), watched by a
  # constrained monitor loop. The engineering budget is enforced inside the
  # deserialized program.
  work:
    - loop:
        name: M5.monitor
        until: engineering_succeeded
        abort_when: engineering_failed
        max_iterations: 3
        # The attempt: run the engineering orchestration, then pre-flight the repo's
        # CI gate against the engineer's LOCAL branch (admin:verify_ci) — both INSIDE
        # the monitor loop, so a CI failure is a failed attempt the loop RETRIES
        # (verify_ci downgrades engineering_result to `failed`; `engineering_succeeded`
        # reads that off the shelf, so `until` only fires when the gate is green). After
        # `max_iterations` red attempts the loop stops on the cap and the build phase
        # runs the fix ladder over the last failed result.
        body:
          sequence:
            name: M5.attempt
            steps:
              - engineer:execute_orchestration
              - admin:verify_ci

  # build — the Administrator's documentation + persistence, then the squash-
  # consolidation (open ONE PR for the engineering branch — engineers commit, the
  # build phase opens the PR), then the engineer-invoice intake (the gh-write
  # label-state-machine transition; #137 rescaffold on a failed/partial result,
  # arm `--squash` auto-merge on completed). Runs last so engineering_result + the
  # stored record + the consolidated PR number are all available.
  build:
    - admin:update_docs
    - admin:publish
    - admin:store
    - admin:consolidate_pr
    - admin:intake_invoice
