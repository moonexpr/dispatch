# websitewf-backend-feature.yml — WebsiteWF use-case overlay: "build new web
# technology that requires backend support" (#169).
#
# An OVERLAY over baseworkflow (extends: baseworkflow + overlays:), sibling to the
# proof vertical app/workflows/websitewf.yml. See
# docs/adr/002-websitewf-overlay-layer.md. It ADDs a backend-scaffold task that
# writes a backend contract spec (API routes + data model + server logic), PROXies
# the engineer to carry that contract, and bumps the budget for the larger scope.
#
# Validate with:
#   python3 -m foundation.workflow app/workflows/websitewf-backend-feature.yml \
#     --registry websitewf.usecases.backend_feature:build_registry
name: websitewf-backend-feature

extends: baseworkflow            # the base document is never edited — this file is a diff

uses:
  # Manifests for THIS use case's web:* actions live in their own subdir so the base
  # websitewf.yml's single-star glob never picks them up (the 5 verticals never collide).
  - ../../websitewf/actions/backend_feature/*.yml

# A bigger budget for the larger scope (backend + page/route). The loader merges
# overlay budgets over the base buckets (budgets = {**base, **overlay}).
budgets:
  total: 1200000
  engineering: 650000

# ── overlays ───────────────────────────────────────────────────────────────
# Ordered, top-to-bottom; a later op sees earlier ops' effect.
overlays:

  # 1. ADD — splice a backend-scaffold task into the `spec` phase, after the
  #    orchestration is authored. Its body writes a backend contract spec (API
  #    routes, data model, server logic) onto deliverables.backend_spec. Placed in
  #    `spec` so the contract is produced upstream of the engineer that consumes it
  #    (the PROXY below sources the orchestration_script from it). The live engineer
  #    does the actual codegen; admin opens the PR.
  - add: web:scaffold_backend
    phase: spec
    after: architect:author_orchestration

  # 2. PROXY — rewire the engineer's I/O so it is driven by the authored backend
  #    contract: source the orchestration_script from deliverables.backend_spec and
  #    mirror the result onto a web-scoped key.
  - proxy: engineer:execute_orchestration
    rewire:
      in:
        orchestration_script: deliverables.backend_spec
      out:
        engineering_result: deliverables.web_engineering_result
