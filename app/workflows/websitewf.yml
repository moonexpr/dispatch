# websitewf.yml — WebsiteWF: an OVERLAY layer over baseworkflow, specialized for
# web development. See docs/adr/002-websitewf-overlay-layer.md for the rationale.
#
# WebsiteWF reuses baseworkflow's phases (spec → work → build), agents, budgets and
# wiring verbatim, and applies a small, auditable diff via `extends:` + `overlays:`
# (merged at load by engine/workflow/overlay.py). Selected at runtime with
# DISPATCH_ENGINE=websitewf (baseworkflow is the default authoring engine).
#
# The WebsiteWF *engine* (controller + bindings) is a sibling of src/baseworkflow,
# under src/websitewf/; the web action manifests live in src/websitewf/actions/ and
# are pulled in by `uses:` below. Validate with:
#   python3 -m engine.workflow app/workflows/websitewf.yml \
#     --registry src.websitewf.bindings:build_registry
name: websitewf

extends: baseworkflow            # inherit baseworkflow's full WorkflowNode (the base
                                 # document is never edited — this file is a diff)

uses:
  # The web:* action manifests live with the WebsiteWF engine under src/websitewf/;
  # this workflow doc lives in app/workflows/, so the include reaches across to it
  # (resolved relative to this file's directory).
  - ../../src/websitewf/actions/*.yml

# ── overlays ───────────────────────────────────────────────────────────────
# Ordered, top-to-bottom; a later op sees earlier ops' effect. This first increment
# proves all four overlay verbs on ONE use case — "add a new page or route"
# (ADR-002 §Decision.5). The remaining web use cases are the WebsiteWF epic's
# children and will land as further overlays.
overlays:

  # 1. REPLACE — substitute the generic work-unit generator with a route-aware one
  #    that also authors the route spec (deliverables.web_route_spec).
  - replace: github:generate_work_units
    with: web:generate_route_work_units

  # 2. EXTEND — augment (don't replace) the architect's strategy classifier. The base
  #    classify_strategy still runs; web:classify_route_addendum runs AFTER it to tag
  #    the target framework (Next.js | Laravel) + route path onto the strategy.
  - extend: architect:classify_strategy
    mode: after
    with: web:classify_route_addendum

  # 3. ADD — splice a new task into the `work` phase, after the engineer loop, to lay
  #    down + wire the page/route scaffold.
  - add: web:scaffold_route
    phase: work
    after: engineer:execute_orchestration

  # 4. PROXY — rewire the engineer's I/O via a proxy action (the new kind). The target
  #    binding is untouched; the proxy sources the engineer's orchestration_script
  #    from the authored route spec, and mirrors its result to a web-scoped key.
  - proxy: engineer:execute_orchestration
    rewire:
      in:
        orchestration_script: deliverables.web_route_spec
      out:
        engineering_result: deliverables.web_engineering_result
